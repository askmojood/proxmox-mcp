[project]
name = "proxmox-mcp"
version = "0.1.0"
description = "Mojood Connect demo: an MCP server for Proxmox VE (VMs, containers, storage, backups), with confirm-before-change actions."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "mcp>=2.3",
  "httpx>=0.28",
  "uvicorn>=0.54",
]

[project.scripts]
proxmox-mcp = "proxmox_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_mcp"]
